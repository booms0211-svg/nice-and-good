    {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "사주팔자 - 만세력 기반 사주풀이",
        "description": "생년월일시를 입력하여 만세력 기반의 정확한 사주팔자를 알아보세요. 무료 사주풀이 서비스입니다.",

<body>

    <main class="main-content">
        <section class="saju-section">
            <div class="container">
                <h1 data-i18n="saju_title">사주팔자 알아보기</h1>
                <p class="intro-text" data-i18n="saju_intro">생년월일시를 입력하면 당신의 사주를 알려드립니다.</p>
                <div class="saju-form">
                    <div class="form-group">
                        <label for="year">년</label>
                        <input type="number" id="year" placeholder="1990">
                    </div>
                    <div class="form-group">
                        <label for="month">월</label>
                        <input type="number" id="month" placeholder="5">
                    </div>
                    <div class="form-group">
                        <label for="day">일</label>
                        <input type="number" id="day" placeholder="15">
                    </div>
                    <div class="form-group">
                        <label for="hour">시</label>
                        <input type="number" id="hour" placeholder="14">
                    </div>
                    <button id="calculate-btn" data-i18n="calculate_btn">사주 보기</button>
                </div>
                <div id="saju-result" class="saju-result"></div>
            </div>
        </section>
    </main>

    <script src="main.js?v=2" type="module"></script>
